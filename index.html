<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سباق المعرفة</title>
<style>
:root{--a:#facc15}
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:linear-gradient(160deg,#1e1b4b,#4c1d95);color:#fff;min-height:100vh}
#app{max-width:1100px;margin:auto;padding:14px}
.c{text-align:center}
.card{background:#ffffff14;border-radius:18px;padding:18px;margin:12px auto;max-width:520px}
.card.w{max-width:none}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;font-size:16px}
.b{background:var(--a);color:#222;border:0;border-radius:12px;padding:12px 20px;font-size:17px;font-weight:700;cursor:pointer;margin:4px}
.b.s{padding:6px 12px;font-size:14px}.b.r{background:#ef4444;color:#fff}.b.g{background:#ffffff30;color:#fff}
.big{font-size:64px}.code{font-size:56px;letter-spacing:8px;color:var(--a);font-weight:800}
.er{color:#fca5a5}.sm{color:#c4b5fd;font-size:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{border:0;border-radius:14px;color:#fff;font-size:20px;padding:22px 8px;cursor:pointer;font-weight:700;text-align:center}
.o:disabled{opacity:.5}.o.ok{outline:5px solid #fff}.o.no{opacity:.35}
.bar{height:10px;background:#ffffff30;border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--a);width:100%}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#ffffff14;border-radius:10px;padding:8px 12px;margin:5px 0;text-align:right}
.tr{position:relative;background:#0005;border-radius:14px;margin-top:10px;overflow:hidden;background-image:repeating-linear-gradient(#0000 0 23px,#ffffff12 23px 24px)}
.pl{position:absolute;height:24px;line-height:24px;white-space:nowrap;font-size:14px;transition:right 1s,top 1s;background:#0007;border-radius:12px;padding:0 8px}
.hit{animation:sh .6s;background:#ef4444}.hit::after{content:' 💥'}
@keyframes sh{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
.gate{position:absolute;top:0;bottom:0;width:4px;background:repeating-linear-gradient(#facc15 0 8px,#0000 8px 16px);opacity:.5}
.fin{position:absolute;left:6px;top:4px;font-size:26px}
.pod{display:flex;direction:ltr;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0}
.pod>div{width:28%;border-radius:14px 14px 0 0;padding-top:8px;font-weight:800;font-size:18px;animation:up 1.2s both}
@keyframes up{from{transform:translateY(120%);opacity:0}}
.pct{height:10px;border-radius:5px;background:#10b981}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
// ====== الإعدادات: ضع بيانات مشروعك من Supabase > Settings > API ======
const SB_URL='https://rdgmlkdhslqtmexfhvgm.supabase.co', SB_KEY='sb_publishable_1GEYHBtvQAAYploRcj7Q4Q_CbIDqY3_';
// ======================================================================
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AV=['🦊','🐯','🦁','🐼','🐸','🦄','🐙','🦖','🚀','🐲','🦅','🐬'];
const COL=['#ef4444','#3b82f6','#f59e0b','#10b981'], SH=['▲','◆','●','■'];
const view=h=>app.innerHTML=h;
const bind=m=>document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>m[b.dataset.a](b.dataset.i));
const boom=()=>{if(!window.confetti)return;const e=Date.now()+6000;(function f(){confetti({particleCount:6,angle:60,spread:70,origin:{x:0}});confetti({particleCount:6,angle:120,spread:70,origin:{x:1}});if(Date.now()<e)requestAnimationFrame(f)})()};
let db,chan=[],tm;
const clear=()=>{chan.forEach(c=>db.removeChannel(c));chan=[];clearInterval(tm)};
const sub=(table,filter,fn)=>chan.push(db.channel(table+Math.random()).on('postgres_changes',{event:'*',schema:'public',table,filter},fn).subscribe());

function route(){
  if(SB_URL.startsWith('PUT'))return view('<div class="card c"><h2>⚙️ أضف بيانات Supabase في أعلى الكود</h2></div>');
  clear(); location.hash.startsWith('#/t')?teacher():student();
}

/* ================= لوحة المعلم ================= */
async function teacher(){
  clear();
  const {data:{session}}=await db.auth.getSession();
  session?dash():login();
}
function login(){
  view(`<div class="card c"><h1>👨‍🏫 لوحة المعلم</h1><input id=em type=email placeholder="البريد الإلكتروني"><input id=pw type=password placeholder="كلمة المرور (6 أحرف فأكثر)">
  <button class=b id=li>دخول</button><button class="b g" id=su>إنشاء حساب</button><p id=er class=er></p><a class=sm href="#/">صفحة الطلاب</a></div>`);
  const go=async f=>{const {error}=await db.auth[f]({email:$('#em').value,password:$('#pw').value});error?$('#er').textContent=error.message:teacher()};
  $('#li').onclick=()=>go('signInWithPassword'); $('#su').onclick=()=>go('signUp');
}
async function dash(){
  const {data:qs}=await db.from('quizzes').select('id,title,questions(count)').order('created_at',{ascending:false});
  view(`<h1>📚 اختباراتي</h1><div class=card><input id=nt placeholder="عنوان اختبار جديد"><button class=b id=add>+ إنشاء</button><button class="b g" data-a=rp>📊 التقارير</button><button class="b g" data-a=lo>خروج</button></div>`+
  (qs||[]).map(q=>`<div class=row><b>${esc(q.title)} (${q.questions[0].count})</b><span><button class="b s" data-a=run data-i=${q.id}>▶ تشغيل</button><button class="b s g" data-a=ed data-i=${q.id}>تعديل</button><button class="b s r" data-a=del data-i=${q.id}>حذف</button></span></div>`).join(''));
  $('#add').onclick=async()=>{const t=$('#nt').value.trim();if(!t)return;const {data}=await db.from('quizzes').insert({title:t}).select().single();editor(data.id)};
  bind({rp:()=>report(),lo:()=>db.auth.signOut().then(teacher),run,ed:id=>editor(id),del:async id=>{if(confirm('حذف الاختبار نهائياً؟')){await db.from('quizzes').delete().eq('id',id);dash()}}});
}
async function editor(id,eid){
  const [{data:z},{data:qs}]=await Promise.all([db.from('quizzes').select('*').eq('id',id).single(),db.from('questions').select('*').eq('quiz_id',id).order('pos').order('id')]);
  const e=eid?qs.find(x=>x.id==eid):null,K=e?.kind||'mc',pr=K=='match'?e.opts:[],BD={mc:'',tf:'[صح/خطأ] ',fill:'[فراغ] ',match:'[توصيل] '};
  view(`<a class=sm href="#/t" id=bk>← رجوع</a><h2>${esc(z.title)}</h2>
  <div class=card><select id=kd>${[['mc','اختيار من متعدد'],['tf','صح أو خطأ'],['fill','أكمل الفراغ (3 كلمات)'],['match','توصيل']].map(a=>`<option value=${a[0]} ${K==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select>
  <textarea id=qt rows=2 placeholder="نص السؤال (في الفراغ اكتب ___ مكان الكلمة الناقصة)">${esc(e?.q||'')}</textarea>
  <div id=ops>${[0,1,2,3].map(i=>`<input class=op placeholder="الخيار ${i+1}" value="${esc(K=='mc'||K=='fill'?e?.opts[i]||'':'')}">`).join('')}</div>
  <div id=prs>${[0,1,2,3].map(i=>`<div style="display:flex;gap:6px"><input placeholder="العنصر ${i+1}" value="${esc(pr[i]?.[0]||'')}"><input placeholder="ما يقابله" value="${esc(pr[i]?.[1]||'')}"></div>`).join('')}</div>
  <select id=cr></select><input id=sc type=number min=5 max=120 value="${e?.secs||20}" title="الثواني">
  <button class=b id=sv>${e?'حفظ التعديل':'+ إضافة السؤال'}</button><p id=er class=er></p></div>
  <div class=card><b>استيراد دفعة واحدة (اختيار من متعدد)</b> <span class=sm>(الصق من Excel أو CSV، كل سطر: السؤال، خيار1، خيار2، خيار3، خيار4، رقم الصحيح، الثواني)</span><textarea id=im rows=4></textarea><button class="b g" id=imp>استيراد</button></div>`+
  qs.map((x,i)=>`<div class=row><span>${i+1}. ${BD[x.kind]||''}${esc(x.q)}</span><span><button class="b s g" data-a=e data-i=${x.id}>✏️</button><button class="b s r" data-a=d data-i=${x.id}>🗑</button></span></div>`).join(''));
  const trim=a=>{while(a.length&&!a[a.length-1])a.pop();return a},err=m=>$('#er').textContent=m;
  const fix=()=>{const k=$('#kd').value,n=k=='tf'?2:k=='fill'?3:4,cur=Math.min(n-1,+($('#cr').value||(e&&K==k?e.correct:0)));
    $('#ops').hidden=!(k=='mc'||k=='fill');$('#prs').hidden=k!='match';$('#cr').hidden=k=='match';
    $('#cr').innerHTML=Array.from({length:n},(_,i)=>`<option value=${i} ${i==cur?'selected':''}>الإجابة الصحيحة: ${k=='tf'?['صح','خطأ'][i]:'الخيار '+(i+1)}</option>`).join('')};
  $('#kd').onchange=fix;fix();
  $('#sv').onclick=async()=>{
    const k=$('#kd').value,q=$('#qt').value.trim();let o,c=+$('#cr').value||0;
    if(!q)return err('اكتب نص السؤال');
    if(k=='tf')o=['صح','خطأ'];
    else if(k=='match'){c=0;o=[...document.querySelectorAll('#prs>div')].map(d=>[d.children[0].value.trim(),d.children[1].value.trim()]).filter(x=>x[0]&&x[1]);if(o.length<2)return err('أدخل زوجين على الأقل')}
    else{o=trim([...document.querySelectorAll('.op')].map(x=>x.value.trim()));if(k=='fill')o=o.slice(0,3);
      if(o.length<(k=='fill'?3:2)||o.includes('')||!o[c])return err(k=='fill'?'اكتب 3 كلمات والإجابة الصحيحة واحدة منها':'اكتب خيارين على الأقل بدون فراغات، والإجابة الصحيحة يجب أن تكون خياراً مكتوباً');
      if(k=='fill'&&!q.includes('___'))return err('ضع ___ مكان الفراغ في الجملة')}
    const row={quiz_id:id,q,kind:k,opts:o,correct:c,secs:Math.min(120,Math.max(5,+$('#sc').value||20)),pos:e?e.pos:qs.length};
    const {error}=e?await db.from('questions').update(row).eq('id',e.id):await db.from('questions').insert(row);
    error?err(error.message):editor(id);
  };
  $('#imp').onclick=async()=>{
    const rows=$('#im').value.split('\n').map(l=>l.split(/\t|,/).map(x=>x.trim())).filter(r=>r.length>=4&&r[0]).map((r,i)=>{
      const o=trim(r.slice(1,5)),c=(parseInt(r[5])||1)-1;return o.length>=2&&o[c]?{quiz_id:id,q:r[0],opts:o,correct:c,secs:Math.min(120,Math.max(5,parseInt(r[6])||20)),pos:qs.length+i}:null}).filter(Boolean);
    if(!rows.length)return err('لم يتم العثور على أسطر صالحة');
    await db.from('questions').insert(rows);editor(id);
  };
  bind({e:x=>editor(id,x),d:async x=>{if(confirm('حذف السؤال؟')){await db.from('questions').delete().eq('id',x);editor(id)}}});
  $('#bk').onclick=()=>setTimeout(teacher);
}

/* ================= التقارير ================= */
async function report(sid){
  if(sid)return detail(sid);
  const {data:L}=await db.from('sessions').select('id,code,state,created_at,quizzes(title)').order('created_at',{ascending:false}).limit(40);
  view(`<a class=sm href="#/t" id=bk>← رجوع</a><h1>📊 جلسات اللعب</h1>`+(L.length?L.map(x=>`<div class=row><span>${esc(x.quizzes?.title)} · ${new Date(x.created_at).toLocaleString('ar')}</span><button class="b s" data-a=o data-i=${x.id}>عرض</button></div>`).join(''):'<p>لا توجد جلسات بعد. شغّل اختباراً أولاً.</p>'));
  bind({o:detail}); $('#bk').onclick=()=>setTimeout(teacher);
}
async function detail(sid){
  const {data:s}=await db.from('sessions').select('*,quizzes(title)').eq('id',sid).single();
  const [{data:P},{data:A},{data:Q}]=await Promise.all([
    db.from('players').select('*').eq('session_id',sid).order('score',{ascending:false}),
    db.from('answers').select('*').eq('session_id',sid),
    db.from('questions').select('q').eq('quiz_id',s.quiz_id).order('pos').order('id')]);
  const rows=P.map((p,i)=>{const a=A.filter(x=>x.player_id==p.id),ok=a.filter(x=>x.ok);return{i:i+1,n:p.name,s:p.score,ok:ok.length,bad:Q.length-ok.length,avg:ok.length?(ok.reduce((t,x)=>t+x.ms,0)/ok.length/1000).toFixed(1):'-'}});
  view(`<a class=sm href="#/t" id=bk>← رجوع</a><h2>${esc(s.quizzes?.title)}</h2><button class=b id=ex>⬇ تصدير Excel (CSV)</button>
  <h3>الأسئلة الأصعب (نسبة الصحيح)</h3>`+Q.map((q,i)=>{const pc=P.length?Math.round(A.filter(x=>x.qi==i&&x.ok).length*100/P.length):0;return`<div class=row><span style="flex:1">${i+1}. ${esc(q.q)}</span><span style="width:40%"><div class=pct style="width:${pc}%;background:${pc<50?'#ef4444':'#10b981'}"></div></span><b>${pc}%</b></div>`}).join('')+
  `<h3>الطلاب</h3>`+rows.map(r=>`<div class=row><span>${r.i}. ${esc(r.n)}</span><span>${r.s} نقطة · صحيح ${r.ok} · خطأ ${r.bad} · متوسط ${r.avg}ث</span></div>`).join(''));
  $('#bk').onclick=()=>setTimeout(()=>report());
  $('#ex').onclick=()=>{
    const csv='\ufeff'+['الترتيب,الاسم,النقاط,صحيح,خطأ,متوسط زمن الصحيح (ث)',...rows.map(r=>[r.i,'"'+r.n.replace(/"/g,'""')+'"',r.s,r.ok,r.bad,r.avg].join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='results.csv';a.click();
  };
}

if(!SB_URL.startsWith('PUT'))db=supabase.createClient(SB_URL,SB_KEY);

</script>
<script src="race.js"></script>
</body>
</html>
